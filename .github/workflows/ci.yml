name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leidario
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: leidario_ci_2026
        ports:
          - "5432:5432"
        # GitHub Actions no arranca los pasos hasta que este health check pasa
        options: >-
          --health-cmd "pg_isready -U postgres -d leidario"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_PASSWORD: leidario_ci_2026

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Eclipse Temurin 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvnw está en Git sin permiso de ejecución, por eso se invoca con sh
      - name: Ejecutar los tests del backend
        run: sh ./mvnw -B test
